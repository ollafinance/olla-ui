apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: olla-ui
  labels:
    app.kubernetes.io/name: olla-ui
    app.kubernetes.io/part-of: olla
spec:
  parentRefs:
    - name: olla-gateway
      sectionName: olla-http
    - name: olla-gateway
      sectionName: olla-https
  hostnames:
    - demo.olla.finance
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: olla-ui
          port: 80
