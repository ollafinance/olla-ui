apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: olla-indexer
  labels:
    app.kubernetes.io/name: olla-indexer
    app.kubernetes.io/part-of: olla
spec:
  parentRefs:
    - name: olla-gateway
      sectionName: olla-indexer-http
    - name: olla-gateway
      sectionName: olla-indexer-https
  hostnames:
    - api.demo.olla.finance
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: olla-indexer
          port: 8080
