name: CI/CD Olla Testnet

on:
  push:
    branches: [testnet]

env:
  REGISTRY: registry.digitalocean.com/olla-containers
  CLUSTER_NAME: aztecscan-prod

jobs:
  set-up:
    runs-on: ubuntu-latest
    outputs:
      tools-cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up tools directory
        run: mkdir -p tools

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Copy doctl to tools directory
        run: |
          cp $(which doctl) tools/
          chmod +x tools/doctl

      - name: Install kubectl
        run: |
          curl -Lo tools/kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x tools/kubectl

      - name: Generate cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-tools-$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ steps.cache-key.outputs.key }}

      - name: Log in to DigitalOcean Container Registry
        run: tools/doctl registry login --expiry-seconds 1200

  build-frontend:
    runs-on: ubuntu-latest
    needs: set-up

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore cached tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ needs.set-up.outputs.tools-cache-key }}
          fail-on-cache-miss: true

      - name: Add tools to PATH
        run: |
          chmod +x tools/*
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Log in to DigitalOcean Container Registry
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/olla-ui
          tags: |
            type=sha,prefix=testnet-
            type=raw,value=testnet-latest

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/frontend/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_APP_ENV=production
            VITE_CONTRACTS_ENV=sepolia
            VITE_RPC_URL_SEPOLIA=${{ secrets.VITE_RPC_URL_SEPOLIA }}
            VITE_WALLET_CONNECT_PROJECT_ID=${{ secrets.VITE_WALLET_CONNECT_PROJECT_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  build-backend:
    runs-on: ubuntu-latest
    needs: set-up

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore cached tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ needs.set-up.outputs.tools-cache-key }}
          fail-on-cache-miss: true

      - name: Add tools to PATH
        run: |
          chmod +x tools/*
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Log in to DigitalOcean Container Registry
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/olla-indexer
          tags: |
            type=sha,prefix=testnet-
            type=raw,value=testnet-latest

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/backend/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - set-up
      - build-frontend
      - build-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore cached tools
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ needs.set-up.outputs.tools-cache-key }}
          fail-on-cache-miss: true

      - name: Add tools to PATH
        run: |
          chmod +x tools/*
          echo "$PWD/tools" >> $GITHUB_PATH

      - name: Configure doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Inject olla-secrets
        run: |
          kubectl create secret generic olla-secrets \
            --from-literal=rpc-url="${{ secrets.RPC_URL_SEPOLIA }}" \
            --namespace olla-prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy frontend
        run: |
          echo "Applying frontend testnet manifests..."
          kubectl apply -k services/frontend/k8s/overlays/testnet/

          echo "Restarting frontend deployment..."
          kubectl rollout restart deployment/olla-ui -n olla-prod

          echo "Waiting for frontend rollout..."
          kubectl rollout status deployment/olla-ui -n olla-prod --timeout=300s

      - name: Deploy backend
        run: |
          echo "Applying backend testnet manifests..."
          kubectl apply -k services/backend/k8s/overlays/testnet/

          echo "Restarting backend deployment..."
          kubectl rollout restart deployment/olla-indexer -n olla-prod

          echo "Waiting for backend rollout..."
          kubectl rollout status deployment/olla-indexer -n olla-prod --timeout=300s

      - name: Deployment complete
        run: echo "Testnet deployment successful!"
