apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: olla-issuer-production
spec:
  acme:
    email: tls@kryha.io
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: olla-issuer-production
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: olla-gateway
                namespace: olla-prod
